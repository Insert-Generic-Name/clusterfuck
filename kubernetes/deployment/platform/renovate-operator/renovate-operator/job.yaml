apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  schedule: "0 * * * *"
  image: renovate/renovate:44
  secretRef: "renovate-operator"
  provider:
    name: forgejo
    endpoint: "https://forgejo.${DOMAIN}:9003" # Remove :9003 once https is set!
  parallelism: 1
  # discoveryFilters:
  #   - "insert-generic-name/*"
  renovateConfig:
    fileName: config.json
    inline: |
      {
      "gitAuthor": "Core Mita <cartridges@local>"
      }
