# Forces all nodes to pull the image used in CI after it is pushed instead of pulling it at runtime.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-puller
  namespace: woodpecker
  labels:
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  selector:
    matchLabels:
      name: image-puller
  template:
    metadata:
      labels:
        name: image-puller
    spec:
      containers:
        - name: image-puller
          image: 192.168.1.60:3000/$${CI_REPO}/toolbox:latest
          command: ["sh", "-c", "sleep infinity"]
