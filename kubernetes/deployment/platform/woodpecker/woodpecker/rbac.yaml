apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-runner
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: woodpecker
roleRef:
  kind: Role
  name: ci-runner
  apiGroup: rbac.authorization.k8s.io
