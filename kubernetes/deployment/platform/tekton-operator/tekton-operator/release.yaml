apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
spec:
  chartRef:
    kind: OCIRepository
    name: tekton-operator
  values:
    installCRDs: true
    controllers: >-
      tektonconfig,
      tektonpipeline,
      tektontrigger,
      tektonchain,
      tektonresult,
      manualapprovalgate,
      tektonpruner,
      tektonscheduler,
      tektonmulticlusterproxyaae,
      openshiftpipelinesascode,
      tektondashboard
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
