apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton
  namespace: tekton-pipelines
spec:
  data:
    - secretKey: forgejo-token
      remoteRef:
        key: tekton
        property: forgejo-token

    - secretKey: forgejo-webhook
      remoteRef:
        key: tekton
        property: forgejo-webhook
