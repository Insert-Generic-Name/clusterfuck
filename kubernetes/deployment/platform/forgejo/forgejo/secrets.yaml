apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  target:
    template:
      engineVersion: v2
      data:
        username: insert-generic-name
        password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: forgejo
        property: password
