when:
  - event: ["push", "pull_request", "manual"]
    path:
      [
        ".mise/config.ci.toml",
        ".mise/mise.ci.lock",
        ".mise/Dockerfile",
        ".woodpecker/ci-image.yaml",
      ]

steps:
  - name: Build & push image to registry
    image: ghcr.io/osscontainertools/kaniko:v1.29.1-debug # Main image lacks a shell
    commands:
      - |
        cat <<EOF > /kaniko/.docker/config.json
        {
          "auths": {
            "$${CI_FORGE_HOST}": {
              "auth": "$${CI_FORGE_CREDENTIALS}"
            }
          }
        }
        EOF
      - >
        /kaniko/executor
        --dockerfile=.mise/Dockerfile
        --context=dir://$${CI_WORKSPACE}/.mise
        --destination=$${CI_FORGE_HOST}/$${CI_REPO}/toolbox:latest
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker
            key: ci-forge-credentials
            target:
              env: CI_FORGE_CREDENTIALS

  - name: Run image puller
    image: alpine:3.22
    commands:
      - apk add kubectl
      - |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: image-puller-$${CI_COMMIT_SHA}
          namespace: woodpecker
        spec:
          selector:
            matchLabels:
              name: image-puller-$${CI_COMMIT_SHA}
          template:
            metadata:
              labels:
                name: image-puller-$${CI_COMMIT_SHA}
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: image-puller
                  imagePullPolicy: Always
                  image: $${CI_FORGE_HOST}/$${CI_REPO}/toolbox:latest
                  command: ["sh", "-c", "sleep infinity"]
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    runAsNonRoot: true
        EOF
        kubectl rollout status daemonset/image-puller-$${CI_COMMIT_SHA} -n woodpecker --timeout=2m
        kubectl delete daemonset/image-puller-$${CI_COMMIT_SHA} -n woodpecker
    backend_options:
      kubernetes:
        serviceAccountName: ci-runner
