when:
  - event: ["push", "pull_request", "manual"]
    path:
      [
        ".mise/config.ci.toml",
        ".mise/mise.ci.lock",
        ".mise/Dockerfile",
        ".woodpecker/ci-image.yaml",
      ]

steps:
  - name: Build & push to registry
    image: ghcr.io/osscontainertools/kaniko:debug # Main image lacks a shell
    commands:
      - echo ${CI_REPO_URL}
      - echo ${CI_REPO_OWNER}
      - >
        /kaniko/executor
        --dockerfile=.mise/Dockerfile
        --context=dir:///.mise
        --destination=${REGISTRY}:${CI_COMMIT_SHA}
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker
