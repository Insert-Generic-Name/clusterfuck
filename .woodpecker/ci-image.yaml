when:
  - event: ["push", "pull_request", "manual"]
    path:
      [
        ".mise/config.ci.toml",
        ".mise/mise.ci.lock",
        ".mise/Dockerfile",
        ".woodpecker/ci-image.yaml",
      ]

steps:
  - name: Build & push to registry
    image: ghcr.io/osscontainertools/kaniko:debug # Main image lacks a shell
    commands:
      # Migrate to $CI_FORGE_HOST envvar when its published ( to get forgejo registry url without http scheme), currently its only in the "next" part of the docs, not published yet for 1.20.1
      # https://woodpecker-ci.org/docs/next/usage/environment#:~:text=CI%5FFORGE%5FHOST
      # Pair it with CI repo owner ( $CI_FORGE_HOST/$CI_REPO_OWNER/image:tag)
      - >
        /kaniko/executor
        --dockerfile=.mise/Dockerfile
        --context=dir:///.mise
        --destination=192.168.1.60:3000/${CI_REPO_OWNER}/toolbox:${CI_COMMIT_SHA}
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker
