when:
  - event: ["push", "pull_request"]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0 # Disable shallow cloning
      partial: false

steps:
  - name: Secret scanning git wide
    image: ${IMAGE}
    commands:
      - git config --global --add safe.directory $${CI_WORKSPACE}
      - mise exec -- gitleaks git --verbose --redact
